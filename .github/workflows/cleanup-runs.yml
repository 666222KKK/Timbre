name: Cleanup workflow runs

# Runs after every CI completion: old run records (and their logs/artifacts)
# accumulate forever otherwise, and there is no repository setting that trims
# the run history itself.
#
# Manual use: Actions -> "Cleanup workflow runs" -> Run workflow, set keep to 0
# to wipe the whole history.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      keep:
        description: "How many recent runs to keep (0 deletes everything)"
        required: false
        default: "20"

permissions:
  actions: write

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs
        uses: actions/github-script@v7
        with:
          script: |
            // workflow_run has no inputs: fall back to the scheduled policy.
            const requested = Number(github.context.payload.inputs?.keep ?? 20);
            const keep = Number.isFinite(requested) ? Math.max(0, requested) : 20;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`keeping the latest ${keep} runs`);

            // One page holds at most 100 runs, so a large backlog needs
            // several rounds before the history is actually down to `keep`.
            let deleted = 0;
            for (let round = 0; round < 50; round++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
              });

              const stale = data.workflow_runs
                .filter((run) => run.id !== context.runId)
                .slice(keep);

              if (stale.length === 0) {
                core.info(`history trimmed to ${data.workflow_runs.length} runs`);
                break;
              }

              let deletedThisRound = 0;
              for (const run of stale) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  deletedThisRound++;
                } catch (error) {
                  // In-progress runs cannot be deleted; skip and retry later.
                  core.warning(`skip run ${run.id} (#${run.run_number}): ${error.message}`);
                }
              }

              deleted += deletedThisRound;
              // Nothing removable in this round: stop instead of spinning.
              if (deletedThisRound === 0) {
                core.warning(`nothing deletable in round ${round + 1}, stopping`);
                break;
              }
            }
            core.info(`deleted ${deleted} stale runs`);
