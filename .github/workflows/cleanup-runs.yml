name: Cleanup workflow runs

# Runs after every CI completion: old run records (and their logs/artifacts)
# accumulate forever otherwise, and there is no repository setting that trims
# the run history itself.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs, keep the latest 20
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 20;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100,
            });

            // The run that triggered this workflow is the newest one; never
            // delete it, and keep the next `keep - 1` as recent history.
            const stale = data.workflow_runs
              .filter((run) => run.id !== context.runId)
              .slice(keep);

            if (stale.length === 0) {
              core.info(`nothing to delete (${data.workflow_runs.length} runs found)`);
              return;
            }

            let deleted = 0;
            for (const run of stale) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted++;
              } catch (error) {
                // In-progress runs cannot be deleted; skip and retry next time.
                core.warning(`skip run ${run.id} (#${run.run_number}): ${error.message}`);
              }
            }
            core.info(`deleted ${deleted} of ${stale.length} stale runs`);
