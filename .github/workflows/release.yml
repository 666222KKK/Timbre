name: Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本名，如 3.6.2.1'
        required: true
        default: '3.6.2.4'
      versionCode:
        description: '递增版本号，如 633'
        required: true
        default: '636'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: reader-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Validate version and signing configuration
        env:
          VERSION_INPUT: ${{ inputs.versionName || github.event.release.tag_name }}
          CODE_INPUT: ${{ inputs.versionCode }}
          TIMBRE_KEYSTORE_BASE64: ${{ secrets.TIMBRE_KEYSTORE_BASE64 }}
          TIMBRE_STORE_PASSWORD: ${{ secrets.TIMBRE_STORE_PASSWORD }}
          TIMBRE_KEY_ALIAS: ${{ secrets.TIMBRE_KEY_ALIAS }}
          TIMBRE_KEY_PASSWORD: ${{ secrets.TIMBRE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo 'Invalid version'; exit 1; }
          CODE="$CODE_INPUT"
          if [ -z "$CODE" ]; then
            [ "$(jq -r .versionName update.json)" = "$VERSION" ] || { echo "::error::请先将 update.json 更新为该 Release 的版本和递增版本码"; exit 1; }
            CODE="$(jq -r .versionCode update.json)"
          fi
          [[ "$CODE" =~ ^[0-9]+$ ]] || exit 1
          for key in TIMBRE_KEYSTORE_BASE64 TIMBRE_STORE_PASSWORD TIMBRE_KEY_ALIAS TIMBRE_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::请先配置签名 Secret: $key，参见 docs/reader-release.md"; exit 1; fi
          done
          mkdir -p signing
          printf '%s' "$TIMBRE_KEYSTORE_BASE64" | base64 --decode > signing/signing.keystore
          printf 'STORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' "$TIMBRE_STORE_PASSWORD" "$TIMBRE_KEY_ALIAS" "$TIMBRE_KEY_PASSWORD" > signing/signing.properties
          echo "READER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "READER_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Tests and checks
        run: ./gradlew voiceUnitTest lintKotlin :app:lintFreeDebug --max-workers=2
      - name: Build optimized signed Release APK
        run: ./gradlew :app:assembleFreeRelease -Pvoice.applicationId=app.timbre.audiobook.reader -Pvoice.versionName="$READER_VERSION" -Pvoice.versionCode="$READER_CODE"
      - name: Verify and collect APK
        run: |
          mkdir -p package
          APK=app/build/outputs/apk/free/release/app-free-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --verbose "$APK"
          cp "$APK" "package/timbre-reader-v$READER_VERSION.apk"
          (cd package && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: timbre-reader-release
          path: package/
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = release ]; then
            gh release upload "$RELEASE_TAG" package/*
          else
            gh release create "v$READER_VERSION" package/* --target "$GITHUB_SHA" --title "Timbre Reader v$READER_VERSION" --generate-notes
          fi
