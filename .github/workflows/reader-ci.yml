name: Reader verification and Release APK
on:
  push:
    branches: [feature/reader-362]
permissions:
  contents: read
concurrency:
  group: reader-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Focused tests
        run: ./gradlew :core:backup:testDebugUnitTest :features:settings:testDebugUnitTest :app:testFreeDebugUnitTest --max-workers=2
      - name: All tests
        run: ./gradlew voiceUnitTest --max-workers=2
      - name: Formatting and Android lint
        run: ./gradlew lintKotlin :app:lintFreeDebug --continue --max-workers=2
      - name: Optimized Release build
        run: ./gradlew :app:assembleFreeRelease -Pvoice.applicationId=app.timbre.audiobook.reader -Pvoice.versionName=3.6.2.1 -Pvoice.versionCode=633
      - uses: actions/upload-artifact@v7
        with:
          name: reader-release-unsigned
          path: app/build/outputs/apk/free/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            app/build/reports/lint-results*
          if-no-files-found: ignore
